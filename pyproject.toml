[project]
name = "deeplabsam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.16.1",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "python-dotenv>=1.2.2",
    "supervision>=0.27.0.post2",
    # timm supplies the HRNet backbone for the SuperAnimal DeepLabCut pose heads,
    # built from the bundled configs (no deeplabcut dependency).
    "timm>=1.0.7",
    "torch>=2.12.0",
    "torchvision>=0.23.0",
    "transformers>=5.10.2",
]

# [project.scripts]  # TODO: re-add when CLI is migrated

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deeplabsam"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: downloads large model weights on first run",
]
