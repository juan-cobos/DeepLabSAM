[project]
name = "deeplabsam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.4",
    "onnxruntime>=1.24.4",
    "opencv-python>=4.13.0.92",
    "osam>=0.4.0",
    "supervision>=0.27.0.post2",
    "trackers>=2.3.0",
]

[project.scripts]
deeplabsam = "deeplabsam.cli:main"
deeplabsam-image = "deeplabsam.image_inference:main"
deeplabsam-video = "deeplabsam.video_inference:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deeplabsam"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: downloads large model weights on first run",
]
