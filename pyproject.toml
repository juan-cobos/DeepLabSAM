[project]
name = "deeplabsam"
version = "0.1.0"
description = "Text-prompted multi-animal pose tracking with pixel-accurate masks (SAM 3 video + DeepLabCut)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "supervision==0.29",
    # timm supplies the HRNet backbone for the SuperAnimal DeepLabCut pose heads,
    # built from the bundled configs (no deeplabcut dependency).
    "timm>=1.0.7",
    "torch>=2.12.0",
    # torchcodec decodes video straight to torch tensors (CHW uint8, RGB) for the
    # pipeline, replacing the cv2 capture + BGR->RGB->numpy frame iterator.
    "torchcodec>=0.8.0",
    "torchvision>=0.23.0",
    "typer>=0.12",
    # [kernels] pulls the compatible kernels range (transformers pins <0.13),
    # enabling SAM 3 mask post-processing (NMS, hole filling, sprinkle removal).
    "transformers[kernels]>=5.10.2",
    "pycocotools>=2.0.11",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "huggingface-hub>=0.24",
]

[project.scripts]
deeplabsam = "deeplabsam.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deeplabsam"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pre-commit>=4.0",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: downloads large model weights on first run",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Vendored DeepLabCut model code — kept as close to upstream as possible.
exclude = ["deeplabsam/pose/_dlc"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
