[project]
name = "deeplabsam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.2",
    "huggingface-hub>=1.16.1",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "psutil>=7.2.2",
    "pycocotools>=2.0.11",
    "python-dotenv>=1.2.2",
    "sam3",
    "supervision>=0.27.0.post2",
    # timm supplies the HRNet backbone for the SuperAnimal DeepLabCut pose heads,
    # built from the bundled configs (no deeplabcut dependency).
    "timm>=1.0.7",
    "torch>=2.12.0",
    "torchvision>=0.23.0",
    # [kernels] pulls the compatible kernels range (transformers pins <0.13),
    # enabling SAM 3 mask post-processing (NMS, hole filling, sprinkle removal).
    "transformers[kernels]>=5.10.2",
]

# [project.scripts]  # TODO: re-add when CLI is migrated

[tool.uv]
# sam3 pins numpy<2, but transformers 5 / torch 2.12 / supervision here all run
# on numpy 2. Override sam3's conservative cap so the whole stack stays on one
# numpy. (Verified sam3 video inference works on numpy 2 at runtime.)
override-dependencies = ["numpy>=2.4.4"]

[tool.uv.sources]
sam3 = { git = "https://github.com/facebookresearch/sam3.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deeplabsam"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: downloads large model weights on first run",
]
